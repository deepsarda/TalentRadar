services:
  - type: web
    name: talentradar
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: MODEL_DATA_POLICY
        value: synthetic_only
      - key: REPO_TOKEN_BUDGET
        value: "12000"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
